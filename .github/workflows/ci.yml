name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ciclartech
          POSTGRES_PASSWORD: ciclartech
          POSTGRES_DB: ciclartech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciclartech"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://ciclartech:ciclartech@localhost:5432/ciclartech

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations pendentes?
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar testes
        run: python manage.py test

      - name: Verificação de segurança do deploy
        # `check --deploy` roda as verificações que só importam em produção
        # (HSTS, cookies seguros, DEBUG desligado, SECRET_KEY). Roda com o
        # ambiente de produção simulado, já que em DEBUG elas são puladas.
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: chave-de-ci-com-tamanho-suficiente-para-validacao-1234
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy --fail-level WARNING

      - name: Estáticos coletados estão atualizados
        # O runtime da Vercel não roda `collectstatic`, então o resultado vai
        # versionado no repositório. Este passo pega o caso de alguém alterar
        # CSS/JS e esquecer de regerar — falha que, sem isso, só apareceria
        # como "minha mudança não subiu" depois do deploy.
        run: |
          python manage.py collectstatic --noinput --clear
          if [ -n "$(git status --porcelain staticfiles/)" ]; then
            echo "::error::staticfiles/ desatualizado. Rode 'python manage.py collectstatic --noinput' e faça commit."
            git status --porcelain staticfiles/ | head -20
            exit 1
          fi
