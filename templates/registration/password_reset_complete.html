{% extends "base.html" %}
{% block title %}Senha alterada · Ciclartech{% endblock %}
{% block full_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg);">
  <div class="card" style="width:380px;max-width:90vw;">
    <div style="font-size:20px;font-weight:800;color:var(--text-strong);margin-bottom:2px;">Senha alterada</div>
    <div class="muted" style="font-size:12.5px;margin-top:8px;line-height:1.6;">
      Sua senha foi redefinida com sucesso. Você já pode entrar com ela.
    </div>
    <div style="margin-top:20px;">
      <a class="btn btn-primary btn-block" href="{% url 'login' %}">Entrar</a>
    </div>
  </div>
</div>
{% endblock %}
