{% extends "base.html" %}
{% block title %}Recuperar senha · Ciclartech{% endblock %}
{% block full_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar-bg);">
  <div class="card" style="width:380px;max-width:90vw;">
    <div style="font-size:20px;font-weight:800;color:var(--text-strong);margin-bottom:2px;">Recuperar senha</div>
    <div class="muted" style="font-size:12.5px;margin-bottom:20px;">
      Informe o e-mail cadastrado. Se ele existir na base, enviaremos um link de redefinição.
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_email">E-mail</label>
        <input type="email" name="email" id="id_email" autofocus required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Enviar link</button>
    </form>
    <div style="margin-top:16px;text-align:center;">
      <a href="{% url 'login' %}" style="font-size:12.5px;">Voltar para o login</a>
    </div>
  </div>
</div>
{% endblock %}
