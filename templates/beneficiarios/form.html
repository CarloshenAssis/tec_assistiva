{% extends "base.html" %}
{% block title %}{{ titulo }} · Ciclartech{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <div class="flex gap-2 mt-2">
      <button class="btn btn-primary" type="submit">Salvar</button>
      <a class="btn btn-secondary" href="{% url 'app:beneficiarios:lista' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
