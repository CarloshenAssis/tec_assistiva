<div class="table">
  <div class="table-head" style="grid-template-columns:140px 140px 1fr 1fr;">
    <div>Data</div><div>Tipo</div><div>Transição</div><div>Usuário</div>
  </div>
  {% for m in movimentacoes %}
    <div class="table-row" style="grid-template-columns:140px 140px 1fr 1fr;">
      <div style="font-size:12.5px;">{{ m.data_hora|date:"d/m/Y H:i" }}</div>
      <div style="font-size:12.5px;font-weight:600;">{{ m.get_tipo_display }}</div>
      <div style="font-size:12.5px;">{{ m.get_status_anterior_display }} → {{ m.get_status_novo_display }}</div>
      <div style="font-size:12.5px;" class="muted">{{ m.usuario|default:"—" }}</div>
    </div>
  {% empty %}
    <div style="padding:20px;font-size:13px;color:var(--text-faint);">Nenhuma movimentação registrada ainda.</div>
  {% endfor %}
</div>
